<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Requisições GSS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1E5EFF;--primary-hover:#1a4fe0;--primary-light:#e8efff;
  --bg:#F4F5F7;--card:#FFFFFF;--text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border-focus:#1E5EFF;
  --success:#15803d;--success-bg:#f0fdf4;--success-border:#bbf7d0;
  --danger:#b91c1c;--danger-bg:#fef2f2;--danger-border:#fecaca;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none !important}
svg.icon{flex-shrink:0;vertical-align:-3px}

/* ─── LOGIN (mesmo padrão visual do Livro de Ocorrências) ─── */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0c1a2e 0%,#0f3460 55%,#1E5EFF 100%);z-index:1000;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:20px;padding:36px 38px;width:360px;max-width:93%;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.login-logo{text-align:center;margin-bottom:8px}
.login-logo img{max-width:120px;max-height:50px}
.login-titulo{font-size:20px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:3px}
.login-sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:24px}
.login-err{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--danger);margin-bottom:12px;display:none}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);transition:border-color .15s}
.login-field input:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(30,94,255,.12)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-right:38px !important}
.pw-eye{position:absolute;right:10px;cursor:pointer;color:var(--text3);display:flex;align-items:center;user-select:none}
.pw-eye:hover{color:var(--text2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:var(--text3);cursor:not-allowed}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);width:auto}.btn-outline:hover{background:var(--bg)}

/* ─── FORMS (troca de senha) ─── */
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-field label .required{color:var(--danger)}
.form-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text)}
.form-field input:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(30,94,255,.12)}

.screen{display:none}
.screen.active{display:flex}
.loading-screen{display:none;align-items:center;justify-content:center;min-height:100vh;width:100%}
.loading-screen.active{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.trocar-senha-screen{align-items:center;justify-content:center;min-height:100vh;width:100%;padding:20px}
.card-box{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px;max-width:400px;width:100%}

/* ─── APP SHELL — mesmo mecanismo do sidebar do desktop/Electron: recolhido
   (56px, só ícones) por padrão, expande (242px, revela rótulos) no hover ─── */
.app-shell{display:none;min-height:100vh}
.app-shell.active{display:flex}
.app-sidebar{width:56px;flex-shrink:0;background:linear-gradient(180deg,#0c1a2e 0%,#0f3460 100%);min-height:100vh;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;overflow:hidden;transition:width .22s cubic-bezier(.4,0,.2,1)}
.app-sidebar:hover{width:242px;box-shadow:4px 0 24px rgba(0,0,0,.35)}
.app-sidebar-header{padding:10px 10px;min-height:57px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;white-space:nowrap}
.app-sidebar-header img{width:36px;height:36px;border-radius:10px;background:#fff;padding:2px;flex-shrink:0;object-fit:contain}
.app-sidebar-header .txt{color:#fff;font-size:12.5px;font-weight:800;line-height:1.3;opacity:0;transition:opacity .15s;white-space:nowrap}
.app-sidebar-header .txt span{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.4);margin-top:1px}
.app-sidebar:hover .app-sidebar-header .txt{opacity:1}
.app-nav{flex:1;padding:8px 0 4px;overflow-y:auto;overflow-x:hidden}
.app-nav-item{display:flex;align-items:center;gap:8px;padding:8px 0 8px 19px;color:rgba(255,255,255,.65);font-size:12.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:background .12s,color .12s;white-space:nowrap;overflow:hidden}
.app-nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.app-nav-item.active{background:rgba(14,165,233,.18);color:#fff;font-weight:700;border-left-color:#0ea5e9}
.app-nav-item.disabled{opacity:.4;cursor:default}
.app-nav-item.disabled:hover{background:none;color:rgba(255,255,255,.65)}
.app-nav-item .ico-wrap{flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center}
.app-nav-item .lbl{opacity:0;transition:opacity .14s;flex:1;overflow:hidden;text-overflow:ellipsis}
.app-sidebar:hover .app-nav-item .lbl{opacity:1}
.app-nav-item .badge-em-breve{margin-left:auto;margin-right:12px;font-size:9px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px;opacity:0;transition:opacity .14s;white-space:nowrap}
.app-sidebar:hover .app-nav-item .badge-em-breve{opacity:1}
.app-sidebar-footer{padding:8px 10px 12px;border-top:1px solid rgba(255,255,255,.08);overflow:hidden}
.app-user{display:flex;align-items:center;gap:8px;margin-bottom:6px;white-space:nowrap}
.app-avatar{width:32px;height:32px;border-radius:8px;background:#0ea5e9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.app-user .info{overflow:hidden;opacity:0;transition:opacity .14s}
.app-sidebar:hover .app-user .info{opacity:1}
.app-user .nome{font-size:11.5px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-user .posto{font-size:10px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-logout{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.4);font-size:11px;font-weight:600;cursor:pointer;background:none;border:none;padding:3px 2px;opacity:0;transition:opacity .14s,color .15s;white-space:nowrap}
.app-sidebar:hover .app-logout{opacity:1}
.app-logout:hover{color:#fca5a5}
.app-main{flex:1;margin-left:56px;display:flex;flex-direction:column;min-height:100vh}
.app-topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:10}
.app-topbar .back-btn{background:none;border:none;cursor:pointer;color:var(--text2);display:flex;align-items:center;padding:6px;border-radius:7px}
.app-topbar .back-btn:hover{background:var(--bg)}
.app-topbar .title{font-size:15px;font-weight:800;color:var(--text)}
.app-content{flex:1;padding:24px;max-width:760px;width:100%}

.err-box{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--danger);margin-bottom:14px;display:none}

/* ─── CATEGORIAS E MATERIAIS ─── */
.cat-header{display:flex;align-items:center;gap:8px;background:#1e3a5f;color:#fff;font-weight:700;font-size:12.5px;padding:10px 14px;border-radius:8px;margin:18px 0 10px;text-transform:uppercase;letter-spacing:.4px}
.cat-header:first-child{margin-top:0}
.mat-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.mat-card img{width:128px;height:128px;object-fit:cover;border-radius:8px;background:var(--bg);flex-shrink:0}
.mat-ph{width:128px;height:128px;border-radius:8px;background:var(--bg);color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mat-info{flex:1;min-width:0}
.mat-nome{font-weight:700;font-size:13px;color:var(--text)}
.mat-un{font-size:11px;color:var(--text3);margin-top:2px}
.mat-card input{width:76px;text-align:center;padding:9px 6px;border:1.5px solid var(--border);border-radius:8px;font-size:14px}
.mat-card input:focus{outline:none;border-color:var(--border-focus)}

.avulso-form{background:var(--card);border:1.5px dashed var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.avulso-form input{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;width:100%}
.avulso-form input:focus{outline:none;border-color:var(--border-focus)}
.avulso-form .btn{width:100%}

/* ─── MEUS PEDIDOS (histórico, últimos 6 meses) ─── */
.hist-mes-header{display:flex;align-items:center;gap:8px;background:#0f3460;color:#fff;font-weight:700;font-size:12.5px;padding:10px 14px;border-radius:8px;margin:18px 0 10px;text-transform:uppercase;letter-spacing:.4px}
.hist-mes-header:first-child{margin-top:0}
.hist-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.hist-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hist-card-data{font-size:11px;color:var(--text3)}
.hist-item-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text);padding:4px 0}
.hist-item-row + .hist-item-row{border-top:1px solid var(--border)}
.hist-item-row .qtd{font-weight:700;color:var(--primary);flex-shrink:0}
.hist-item-contest{display:flex;align-items:flex-start;gap:6px;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);border-radius:6px;padding:6px 8px;font-size:11px;margin:0 0 6px;line-height:1.4}

.sig-wrap{background:#fff;border:1.5px dashed var(--border);border-radius:10px;overflow:hidden}
#sigCanvas{display:block;width:100%;height:180px;touch-action:none}

.foot-actions{position:sticky;bottom:0;background:var(--bg);padding:16px 0 4px;margin-top:8px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .ic{color:var(--text3);margin-bottom:10px;display:flex;justify-content:center}

.success-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.success-wrap .ic{color:var(--success);margin-bottom:16px}

@media (max-width:480px){
  .app-content{padding:16px}
  .mat-card img,.mat-ph{width:96px;height:96px}
}
</style>
</head>
<body>

<!-- ════════════ LOGIN ════════════ -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo"><img src="logo-gss.png" alt="GSS"/></div>
    <div class="login-titulo">Requisições GSS</div>
    <div class="login-sub">Acesso do Responsável de Posto</div>
    <div class="login-err" id="login-erro"></div>
    <div class="login-field">
      <label>Login</label>
      <input type="text" id="login-input" placeholder="seu.usuario" autocomplete="username"/>
    </div>
    <div class="login-field">
      <label>Senha</label>
      <div class="pw-wrap">
        <input type="password" id="senha-input" placeholder="••••••" autocomplete="current-password"/>
        <span class="pw-eye" id="pw-eye-toggle" onclick="togglePw()"></span>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<!-- ════════════ LOADING ════════════ -->
<div class="loading-screen" id="loading-screen">
  <div style="text-align:center">
    <div class="spinner"></div>
    <div style="font-size:14px;color:var(--text2)">Carregando...</div>
  </div>
</div>

<!-- ════════════ TROCAR SENHA (primeiro acesso) ════════════ -->
<div class="screen trocar-senha-screen" id="trocar-senha-screen">
  <div class="card-box">
    <div style="text-align:center;margin-bottom:20px">
      <h1 style="font-size:18px;font-weight:800;margin-bottom:4px">Primeiro Acesso</h1>
      <p style="font-size:13px;color:var(--text2)">Defina uma nova senha para sua conta</p>
    </div>
    <div class="login-err" id="troca-err"></div>
    <div class="form-field">
      <label>Nova Senha <span class="required">*</span></label>
      <input type="password" id="nova-senha-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
    </div>
    <div class="form-field">
      <label>Confirmar Senha <span class="required">*</span></label>
      <input type="password" id="confirma-senha-input" placeholder="Repita a nova senha" autocomplete="new-password"/>
    </div>
    <button class="btn btn-primary" onclick="trocarSenha()">Salvar e Continuar</button>
  </div>
</div>

<!-- ════════════ APP SHELL (pós-login) — sidebar + conteúdo, mesma disposição do desktop ════════════ -->
<div class="app-shell" id="app-shell">
  <aside class="app-sidebar">
    <div class="app-sidebar-header">
      <img src="logo-gss.png" alt="GSS"/>
      <div class="txt">Requisições<span>GSS</span></div>
    </div>
    <nav class="app-nav">
      <div class="app-nav-item active" id="nav-materiais" onclick="irParaMeusPedidos()"></div>
      <div class="app-nav-item disabled" id="nav-uniformes"></div>
      <div class="app-nav-item disabled" id="nav-epi"></div>
    </nav>
    <div class="app-sidebar-footer">
      <div class="app-user">
        <div class="app-avatar" id="sidebar-avatar"></div>
        <div class="info">
          <div class="nome" id="sidebar-user-nome"></div>
          <div class="posto" id="sidebar-user-posto"></div>
        </div>
      </div>
      <button class="app-logout" onclick="sair()" id="btn-logout"></button>
    </div>
  </aside>
  <main class="app-main">
    <div class="app-topbar">
      <button class="back-btn hidden" id="topbar-back"></button>
      <div class="title" id="topbar-title">Requisição de Materiais</div>
    </div>
    <div class="app-content" id="app-content"></div>
  </main>
</div>

<script>

  function icon(name, size) {
    size = size || 16;
    var body = ICONS[name];
    if (!body) return '';
    return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }

  var usuarioLogado = null;
  var catalogo = [];
  var quantidades = {};
  var permiteOutros = false;
  var itensAvulsos = [];

  var sig = { canvas: null, ctx: null, drawing: false, empty: true };

  document.getElementById('nav-materiais').innerHTML = '<span class="ico-wrap">' + icon('package', 17) + '</span><span class="lbl">Requisição de Materiais</span>';
  document.getElementById('nav-uniformes').innerHTML = '<span class="ico-wrap">' + icon('shirt', 17) + '</span><span class="lbl">Requisição de Uniformes</span><span class="badge-em-breve">Em breve</span>';
  document.getElementById('nav-epi').innerHTML = '<span class="ico-wrap">' + icon('shield', 17) + '</span><span class="lbl">Formulário de EPI</span><span class="badge-em-breve">Em breve</span>';

  document.getElementById('topbar-back').innerHTML = icon('arrow-left', 17);

  function headersJson() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY };
  }

  window.togglePw = function() {
    senhaVisivel = !senhaVisivel;
    document.getElementById('senha-input').type = senhaVisivel ? 'text' : 'password';
    document.getElementById('pw-eye-toggle').innerHTML = icon(senhaVisivel ? 'eye-off' : 'eye', 17);
  };

  function salvarSessao() {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ usuario: usuarioLogado, timestamp: Date.now() }));
  }

  function restaurarSessao() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return false;
      var session = JSON.parse(raw);
      if (session && session.usuario && (Date.now() - session.timestamp) < SESSION_MAX_AGE) {
        usuarioLogado = session.usuario;
        return true;
      }
    } catch (e) {}
    localStorage.removeItem(SESSION_KEY);
    return false;
  }

  window.sair = function() {
    localStorage.removeItem(SESSION_KEY);
    usuarioLogado = null;
    document.getElementById('app-shell').classList.remove('active');
    document.getElementById('login-screen').style.display = 'flex';
  };

  // ─── LOGIN ────────────────────────────────────────────────────────────
  window.fazerLogin = async function() {
    var login = document.getElementById('login-input').value.trim();
    var senha = document.getElementById('senha-input').value;
    var errEl = document.getElementById('login-erro');
    errEl.style.display = 'none';
    if (!login || !senha) { errEl.textContent = 'Preencha login e senha.'; errEl.style.display = 'block'; return; }

    var btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      var resp = await fetch(SUPABASE_EDGE + '/auth-form', {
        method: 'POST', headers: headersJson(),
        body: JSON.stringify({ action: 'login', login: login, senha: senha })
      });
      var body = await resp.json();
      btn.disabled = false; btn.textContent = 'Entrar';
      if (!resp.ok || body.error) {
        errEl.textContent = body.error || 'Erro ao entrar.';
        errEl.style.display = 'block';
        return;
      }
      usuarioLogado = body.user;
      salvarSessao();
      if (usuarioLogado.primeiro_acesso) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('trocar-senha-screen').classList.add('active');
      } else {
        entrarNoApp();
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Entrar';
      errEl.textContent = 'Erro de conexão: ' + e.message;
      errEl.style.display = 'block';
    }
  };

  window.trocarSenha = async function() {
    var nova = document.getElementById('nova-senha-input').value;
    var conf = document.getElementById('confirma-senha-input').value;
    var errEl = document.getElementById('troca-err');
    errEl.style.display = 'none';
    if (!nova || nova.length < 6) { errEl.textContent = 'A senha deve ter pelo menos 6 caracteres.'; errEl.style.display = 'block'; return; }
    if (nova !== conf) { errEl.textContent = 'As senhas não coincidem.'; errEl.style.display = 'block'; return; }

    try {
      var resp = await fetch(SUPABASE_EDGE + '/auth-form', {
        method: 'POST', headers: headersJson(),
        body: JSON.stringify({ action: 'trocar-senha', id_acesso: usuarioLogado.id, nova_senha: nova })
      });
      var body = await resp.json();
      if (!resp.ok || body.error) { errEl.textContent = body.error || 'Erro ao trocar senha.'; errEl.style.display = 'block'; return; }
      usuarioLogado.primeiro_acesso = false;
      salvarSessao();
      document.getElementById('trocar-senha-screen').classList.remove('active');
      entrarNoApp();
    } catch (e) {
      errEl.textContent = 'Erro de conexão: ' + e.message;
      errEl.style.display = 'block';
    }
  };

  function entrarNoApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('trocar-senha-screen').classList.remove('active');
    document.getElementById('app-shell').classList.add('active');
    document.getElementById('sidebar-user-nome').textContent = usuarioLogado.nome || '';
    document.getElementById('sidebar-user-posto').textContent = usuarioLogado.posto || '';
    document.getElementById('sidebar-avatar').textContent = (usuarioLogado.nome || '?').trim().charAt(0).toUpperCase();
    irParaMeusPedidos();
  }

  function setNavAtivo(id) {
    ['nav-materiais', 'nav-uniformes', 'nav-epi'].forEach(function(n) {
      document.getElementById(n).classList.toggle('active', n === id);
    });
  }

  function setTopbar(titulo, comVoltar, onVoltar) {
    document.getElementById('topbar-title').textContent = titulo;
    var back = document.getElementById('topbar-back');
    back.classList.toggle('hidden', !comVoltar);
    back.onclick = onVoltar || null;
  }

  // ─── MEUS PEDIDOS (histórico, últimos 6 meses) ─────────────────────────
  // Mês de referência de um pedido — não é o mês calendário do envio, e sim
  // o mês de compra/entrega a que ele se refere. Corte no dia 27: pedidos do
  // dia 1 ao 27 contam pro mês seguinte (ex: 1-27/ago → setembro); pedidos
  // do dia 28 em diante já perderam o corte daquele ciclo e contam pro mês
  // depois do seguinte (ex: 28-31/ago → outubro). Mesma regra replicada no
  // desktop (modulo-suprimentos.js, _mesReferenciaPedido).
  var MESES_ORD = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  function mesReferenciaPedido(dataObj) {
    var offset = dataObj.getDate() <= 27 ? 1 : 2;
    return MESES_ORD[(dataObj.getMonth() + offset) % 12];
  }

  window.irParaMeusPedidos = async function() {
    setNavAtivo('nav-materiais');
    setTopbar('Requisição de Materiais', false);
    var el = document.getElementById('app-content');
    el.innerHTML = '<div class="empty-state">Carregando seus pedidos...</div>';

    var historico = [];
    var erro = null;
    try {
      var resp = await fetch(SUPABASE_EDGE + '/req-materiais', {
        method: 'POST', headers: headersJson(),
        body: JSON.stringify({ action: 'listar-historico', id_acesso: usuarioLogado.id, posto: usuarioLogado.posto })
      });
      var body = await resp.json();
      if (!resp.ok || body.error) throw new Error(body.error || 'Falha ao carregar.');
      historico = body.solicitacoes || [];
    } catch (e) { erro = e.message; }

    var novaBtn = '<div class="foot-actions"><button class="btn btn-primary" onclick="irParaMateriais()">' + icon('plus', 15) + ' Fazer Nova Requisição</button></div>';

    if (erro) {
      el.innerHTML = '<div class="err-box" style="display:block">' + icon('alert-triangle', 14) + ' Não foi possível carregar seus pedidos anteriores agora (' + escapeHtml(erro) + ').</div>' + novaBtn;
      return;
    }

    // Só mostra os últimos 6 meses de referência distintos — não os últimos
    // 6 meses calendário, e sim os 6 ciclos de pedido mais recentes (segue a
    // mesma lógica de corte do dia 27 usada pra atribuir o mês).
    var porMes = {};
    var ordemMeses = [];
    historico.forEach(function(r) {
      var mes = mesReferenciaPedido(new Date(r.criado_em));
      if (!porMes[mes]) { porMes[mes] = []; ordemMeses.push(mes); }
      porMes[mes].push(r);
    });
    ordemMeses.sort(function(a, b) {
      var da = porMes[a].reduce(function(acc, r) { return Math.max(acc, new Date(r.criado_em).getTime()); }, 0);
      var db = porMes[b].reduce(function(acc, r) { return Math.max(acc, new Date(r.criado_em).getTime()); }, 0);
      return db - da;
    });
    ordemMeses = ordemMeses.slice(0, 6);

    if (!ordemMeses.length) {
      el.innerHTML = '<div class="empty-state"><div class="ic">' + icon('clock', 40) + '</div>Você ainda não fez nenhuma requisição.<br/>Comece uma abaixo.</div>' + novaBtn;
      return;
    }

    var html = '';
    ordemMeses.forEach(function(mes) {
      html += '<div class="hist-mes-header">' + icon('clock', 14) + escapeHtml(mes) + '</div>';
      porMes[mes].sort(function(a, b) { return new Date(b.criado_em) - new Date(a.criado_em); }).forEach(function(r) {
        var dt = new Date(r.criado_em);
        var dataFmt = String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
        var itensHtml = (r.itens || []).map(function(it) {
          var apr = it.aprovacao;
          var linha = '<div class="hist-item-row"><span>' + escapeHtml(it.descricao || '') + (it.avulso ? ' <span style="color:var(--text3);font-size:10px">(avulso)</span>' : '') + '</span><span class="qtd">' + it.quantidade + '</span></div>';
          if (apr && apr.status === 'contestado') {
            linha += '<div class="hist-item-contest">' + icon('alert-triangle', 12) +
              '<span>Quantidade ajustada pela sede para <b>' + apr.qtdAprovada + '</b>' + (apr.motivo ? ': ' + escapeHtml(apr.motivo) : '') + '</span></div>';
          }
          return linha;
        }).join('');
        html += '<div class="hist-card"><div class="hist-card-top"><div class="hist-card-data">Enviado em ' + dataFmt + '</div></div>' + itensHtml + '</div>';
      });
    });
    html += novaBtn;
    el.innerHTML = html;
  };

  // ─── REQUISIÇÃO DE MATERIAIS (catálogo) ────────────────────────────────
  window.irParaMateriais = async function() {
    setNavAtivo('nav-materiais');
    setTopbar('Requisição de Materiais', true, function() { irParaMeusPedidos(); });
    quantidades = {};
    itensAvulsos = [];
    permiteOutros = false;
    var el = document.getElementById('app-content');
    el.innerHTML = '<div class="empty-state">Carregando catálogo...</div>';

    try {
      var url = SUPABASE_URL + '/rest/v1/req_materiais_posto?select=*&posto=eq.' + encodeURIComponent(usuarioLogado.posto) + '&ativo=eq.true&order=categoria,descricao';
      var resp = await fetch(url, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
      catalogo = await resp.json();
    } catch (e) {
      el.innerHTML = '<div class="err-box" style="display:block">' + icon('alert-triangle', 14) + ' Erro ao carregar catálogo: ' + e.message + '</div>';
      return;
    }

    try {
      var urlCfg = SUPABASE_URL + '/rest/v1/req_postos_config?select=permite_outros&posto=eq.' + encodeURIComponent(usuarioLogado.posto);
      var respCfg = await fetch(urlCfg, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
      var cfgArr = await respCfg.json();
      permiteOutros = !!(cfgArr && cfgArr[0] && cfgArr[0].permite_outros);
    } catch (e) { permiteOutros = false; }

    if ((!catalogo || !catalogo.length) && !permiteOutros) {
      el.innerHTML = '<div class="empty-state"><div class="ic">' + icon('inbox', 40) + '</div>Nenhum material habilitado para este posto ainda.<br/>Fale com a administração.</div>';
      return;
    }

    var porCategoria = {};
    var ordem = [];
    (catalogo || []).forEach(function(m) {
      var cat = m.categoria || 'Outros';
      if (!porCategoria[cat]) { porCategoria[cat] = []; ordem.push(cat); }
      porCategoria[cat].push(m);
    });

    var html = '<div class="err-box" id="req-materiais-err"></div>';
    ordem.forEach(function(cat) {
      html += '<div class="cat-header">' + icon('package', 14) + escapeHtml(cat) + '</div>';
      porCategoria[cat].forEach(function(m) {
        var fotoHtml = m.foto_url ? '<img src="' + m.foto_url + '" alt=""/>' : '<div class="mat-ph">' + icon('package', 44) + '</div>';
        html += '<div class="mat-card">' + fotoHtml +
          '<div class="mat-info"><div class="mat-nome">' + escapeHtml(m.descricao) + '</div><div class="mat-un">' + escapeHtml(m.unidade || '') + '</div></div>' +
          '<input type="number" min="0" step="1" placeholder="0" oninput="setQtd(\'' + m.material_id + '\', this.value)"/>' +
          '</div>';
      });
    });

    if (permiteOutros) {
      html += '<div class="cat-header">' + icon('plus-circle', 14) + 'Outros Itens</div>';
      html += '<div id="avulsos-lista"></div>';
      html += '<div class="avulso-form">' +
        '<input type="text" id="avulso-nome" placeholder="Nome do item"/>' +
        '<input type="number" id="avulso-qtd" min="1" step="1" placeholder="Qtd."/>' +
        '<input type="text" id="avulso-link" placeholder="Link de referência (Mercado Livre, Google...)"/>' +
        '<button class="btn btn-outline" onclick="adicionarItemAvulso()">' + icon('plus', 14) + ' Adicionar</button>' +
        '</div>';
    }

    html += '<div class="foot-actions"><button class="btn btn-primary" onclick="irParaAssinatura()">Continuar</button></div>';
    el.innerHTML = html;
    if (permiteOutros) renderAvulsosLista();
  };

  window.setQtd = function(materialId, val) {
    var n = parseFloat(val);
    if (!n || n <= 0) { delete quantidades[materialId]; return; }
    quantidades[materialId] = n;
  };

  // ─── ITENS AVULSOS ("Outros") ─────────────────────────────────────────
  window.adicionarItemAvulso = function() {
    var errEl = document.getElementById('req-materiais-err');
    var nome = document.getElementById('avulso-nome').value.trim();
    var qtd = parseFloat(document.getElementById('avulso-qtd').value);
    var link = document.getElementById('avulso-link').value.trim();
    if (!nome) { errEl.innerHTML = icon('alert-triangle', 14) + ' Informe o nome do item avulso.'; errEl.style.display = 'block'; return; }
    if (!qtd || qtd <= 0) { errEl.innerHTML = icon('alert-triangle', 14) + ' Informe a quantidade do item avulso.'; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    itensAvulsos.push({ descricao: nome, quantidade: qtd, link: link, avulso: true });
    document.getElementById('avulso-nome').value = '';
    document.getElementById('avulso-qtd').value = '';
    document.getElementById('avulso-link').value = '';
    renderAvulsosLista();
  };

  window.removerItemAvulso = function(idx) {
    itensAvulsos.splice(idx, 1);
    renderAvulsosLista();
  };

  function renderAvulsosLista() {
    var el = document.getElementById('avulsos-lista');
    if (!el) return;
    if (!itensAvulsos.length) { el.innerHTML = ''; return; }
    el.innerHTML = itensAvulsos.map(function(it, i) {
      return '<div class="mat-card"><div class="mat-ph">' + icon('shopping-bag', 20) + '</div>' +
        '<div class="mat-info"><div class="mat-nome">' + escapeHtml(it.descricao) + '</div>' +
        '<div class="mat-un">Qtd: ' + it.quantidade + (it.link ? ' · <a href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener">link</a>' : '') + '</div></div>' +
        '<button class="btn btn-outline" style="width:auto;padding:8px 12px" onclick="removerItemAvulso(' + i + ')">' + icon('x', 14) + '</button></div>';
    }).join('');
  }

  window.irParaAssinatura = function() {
    var errEl = document.getElementById('req-materiais-err');
    if (Object.keys(quantidades).length === 0 && itensAvulsos.length === 0) {
      errEl.innerHTML = icon('alert-triangle', 14) + ' Informe a quantidade de pelo menos um material ou adicione um item avulso.';
      errEl.style.display = 'block';
      return;
    }
    setTopbar('Assinatura', true, function() { irParaMateriais(); });
    var el = document.getElementById('app-content');
    el.innerHTML =
      '<div style="font-size:13px;color:var(--text2);margin-bottom:12px">Assine no campo abaixo para confirmar a requisição</div>' +
      '<div class="sig-wrap"><canvas id="sigCanvas"></canvas></div>' +
      '<div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-outline" onclick="limparAssinatura()">' + icon('rotate-ccw', 14) + ' Limpar</button></div>' +
      '<div class="foot-actions"><div class="err-box" id="assinatura-err"></div><button class="btn btn-primary" id="btn-enviar-req" onclick="enviarRequisicao()">' + icon('edit', 15) + ' Confirmar e Enviar</button></div>';
    initSignature();
  };

  // ─── ASSINATURA (canvas) ──────────────────────────────────────────────
  function initSignature() {
    var canvas = document.getElementById('sigCanvas');
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio || 1);
    canvas.height = rect.height * (window.devicePixelRatio || 1);
    var ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0f172a';
    sig.canvas = canvas; sig.ctx = ctx; sig.drawing = false; sig.empty = true;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(e) { e.preventDefault(); sig.drawing = true; sig.empty = false; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!sig.drawing) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function end() { sig.drawing = false; }

    canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
    canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
  }

  window.limparAssinatura = function() {
    if (!sig.ctx) return;
    sig.ctx.clearRect(0, 0, sig.canvas.width, sig.canvas.height);
    sig.empty = true;
  };

  // ─── ENVIAR ───────────────────────────────────────────────────────────
  window.enviarRequisicao = async function() {
    var errEl = document.getElementById('assinatura-err');
    errEl.style.display = 'none';
    if (sig.empty) { errEl.innerHTML = icon('alert-triangle', 14) + ' Assine no campo acima antes de enviar.'; errEl.style.display = 'block'; return; }

    var itens = Object.keys(quantidades).map(function(materialId) {
      var m = catalogo.find(function(x) { return x.material_id === materialId; });
      return { material_id: materialId, descricao: m ? m.descricao : '', quantidade: quantidades[materialId] };
    }).concat(itensAvulsos.map(function(it) {
      return { material_id: null, descricao: it.descricao, quantidade: it.quantidade, link: it.link, avulso: true };
    }));

    var btn = document.getElementById('btn-enviar-req');
    btn.disabled = true; btn.textContent = 'Enviando...';

    try {
      var resp = await fetch(SUPABASE_EDGE + '/req-materiais', {
        method: 'POST', headers: headersJson(),
        body: JSON.stringify({
          action: 'salvar',
          id_acesso: usuarioLogado.id,
          posto: usuarioLogado.posto,
          colaborador_nome: usuarioLogado.nome,
          itens: itens,
          assinatura: sig.canvas.toDataURL('image/png')
        })
      });
      var body = await resp.json();
      if (!resp.ok || body.error) {
        btn.disabled = false; btn.innerHTML = icon('edit', 15) + ' Confirmar e Enviar';
        errEl.textContent = body.error || 'Erro ao enviar.'; errEl.style.display = 'block';
        return;
      }
      mostrarSucesso();
    } catch (e) {
      btn.disabled = false; btn.innerHTML = icon('edit', 15) + ' Confirmar e Enviar';
      errEl.textContent = 'Erro de conexão: ' + e.message;
      errEl.style.display = 'block';
    }
  };

  function mostrarSucesso() {
    setTopbar('Requisição Enviada', false);
    document.getElementById('app-content').innerHTML =
      '<div class="success-wrap"><div class="ic">' + icon('check-circle', 56) + '</div>' +
      '<h1 style="font-size:19px;font-weight:800">Requisição enviada!</h1>' +
      '<div style="font-size:13px;color:var(--text2);margin:10px 0 24px">Seu pedido foi registrado com sucesso.</div>' +
      '<button class="btn btn-primary" style="max-width:240px" onclick="irParaMateriais()">Nova Requisição</button></div>';
  }

  function escapeHtml(s) {
    return (s || '').toString().replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ─── INICIALIZAÇÃO ────────────────────────────────────────────────────
  if (restaurarSessao()) {
    entrarNoApp();
  }
})();
</script>
